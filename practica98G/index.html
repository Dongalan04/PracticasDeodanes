<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Iphone 14</title>
</head>
<body>
    <h1>Registro para ganar un iPhone 14 Pro Max</h1>

    <Form>
        <label for="fname">Nombre...</label><br>
        <input type="text" name="Fname" id="fname"><br>
        <label for="clave">Contraseña:</label> <br>
        <input type="password" id="clave" name="clave"> <br>
        <p>¿Vive en San Salvador?</p>
        <input type="radio" id="si" name="residencia">
        <label for="si">Si</label> <br>
        <input type="radio" id="no" name="residencia">
        <label for="no">No</label> <br> <br>
        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad"> <br>
        <label for="correo">Correo electronico:</label> <br>
        <input type="email" id="correo" name="correo"> <br> <br>
        <input type="submit" value="Registrarse">
        <input type="reset" value="Borrar"> <br>

    </Form>
</body>
</html>
